# Dispara un build en Vercel cuando GitHub no recibe webhooks del proyecto.
# En Vercel: Project → Settings → Git → Deploy Hooks → Create (rama main).
# En GitHub: repo → Settings → Secrets → VERCEL_DEPLOY_HOOK = URL del hook.
name: Vercel preview

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST Deploy Hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Sin VERCEL_DEPLOY_HOOK. Crea el Deploy Hook en Vercel y añade el secreto en GitHub Actions."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
          echo "Build solicitado en Vercel."
